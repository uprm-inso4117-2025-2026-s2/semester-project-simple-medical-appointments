name: 🛠️ Developer Issue
description: Use this template to define a development task or feature clearly.
title: "[Feature] "
labels: ["task"]

body:
  - type: markdown
    attributes:
      value: |
        ## Title
        _Example: Implement Accessibility Testing for the Login & Sign-Up Process_


  - type: markdown
    attributes:
      value: |
        ## 🎯 Goal

  - type: textarea
    id: goal
    attributes:
      description: What is the main goal of this task?
      placeholder: |
        Example:
        Ensure login and sign-up pages are accessible to all users by validating compliance with WCAG standards.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 📋 Proposed Solution

  - type: textarea
    id: description
    attributes:
      description: Describe what needs to be done.
      placeholder: |
        - UI elements must be properly labeled and accessible via screen readers.
        - Forms should be fully navigable via keyboard.
        - Maintain proper contrast ratios and color usage.
        - Error messages and status updates must be conveyed to assistive technology.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## ✅ Success Criteria

  - type: textarea
    id: acceptance_criteria
    attributes:
      description: Define what must be true for this issue to be considered complete.
      placeholder: |
        - All input fields and interactive elements are screen reader-friendly.
        - The login and sign-up process is fully navigable using only a keyboard.
        - Error messages and validation feedback are properly announced.
        - The UI meets WCAG 2.1 AA standards.
        - An automated accessibility report is generated and reviewed.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## 🚦Urgency & Difficulty

  - type: dropdown
    id: urgency
    attributes:
      label: Urgency:
      options:
        - "1 – Very Low"
        - "2 – Low"
        - "3 – Minor"
        - "4 – Below Normal"
        - "5 – Normal"
        - "6 – Above Normal"
        - "7 – High"
        - "8 – Very High"
        - "9 – Severe"
        - "10 – Critical"
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty: 
      options:
        - "1 – Very Easy"
        - "2 – Easy"
        - "3 – Fairly Easy"
        - "4 – Moderate"
        - "5 – Somewhat Hard"
        - "6 – Hard"
        - "7 – Very Hard"
        - "8 – Extremely Hard"
        - "9 – Expert Level"
        - "10 – Nearly Impossible"
    validations:
      required: true

- type: markdown
  attributes:
    value: "## 👤 Recommended Assigned Developer"

- type: input
  id: recommended_assignee
  attributes:
    placeholder: "@username"
  validations:
    required: false


