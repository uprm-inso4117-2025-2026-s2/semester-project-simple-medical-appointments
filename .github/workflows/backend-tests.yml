name: Backend Test Pipeline

on:
  push:
    branches: [main, Documentation]
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-tests.yml
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run BDD scenarios
        run: |
          cd backend
          pytest tests/bdd -v --tb=short

      - name: Run backend unit tests
        run: |
          cd backend
          pytest tests/unit -v --tb=short

      - name: Run load-smoke test (Locust)
        run: |
          cd backend
          nohup python -c "from app import create_app; app=create_app(testing=True); app.run(host='127.0.0.1', port=5000)" > /tmp/backend.log 2>&1 &
          sleep 5
          locust -f tests/load/locust_smoke.py --host=http://127.0.0.1:5000 --headless -u 10 -r 10 --run-time 20s --only-summary
